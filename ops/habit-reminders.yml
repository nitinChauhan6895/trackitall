# Hourly trigger for habit reminders.
#
# Vercel's Hobby plan can't run cron this often, so the schedule lives here.
# GitHub may delay a scheduled run by several minutes under load, which is why
# the sender accepts a 60-minute delivery window rather than requiring an exact
# match — a reminder arriving late beats one that never arrives.
name: Habit reminders

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC)
    - cron: "17 4 * * 1" # weekly keepalive, Mondays 04:17 UTC
  workflow_dispatch: {} # lets you fire one manually to test

jobs:
  send:
    if: github.event.schedule != '17 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder send
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "${{ secrets.APP_URL }}/api/push/run" \
            -H "Authorization: Bearer ${{ secrets.PUSH_CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/out.json
          # Fail the job on a non-2xx so a broken secret or deploy is visible
          # in the Actions tab instead of silently sending nothing forever.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

  # GitHub disables scheduled workflows after 60 days without repo activity,
  # which silently stopped reminders once already. Re-enabling the workflow
  # through the API resets that timer, so no commits are needed.
  keepalive:
    if: github.event.schedule == '17 4 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/habit-reminders.yml/enable"
