<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0D0A" />
    <title>Offline · TrackItAll</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0C0D0A;
        color: #F1F3EA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap { max-width: 22rem; }
      .icon { font-size: 3rem; line-height: 1; }
      h1 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0; }
      p { color: #8D9483; font-size: 0.875rem; line-height: 1.5; margin: 0.5rem 0 0; }
      button {
        margin-top: 1.5rem;
        background: #A8E830;
        color: #141807;
        border: 0;
        border-radius: 1rem;
        padding: 0.85rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 700;
        font-family: inherit;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon" aria-hidden="true">📴</div>
      <h1>You're offline</h1>
      <p>
        This screen hasn't been saved for offline use yet. Screens you've already
        opened will still work, and anything you log will sync once you're back
        online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
